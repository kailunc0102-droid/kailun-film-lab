<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Film Lab">
<meta name="theme-color" content="#0f0e0d">
<title>KaiLun Film Lab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0d;--s1:#171614;--s2:#1e1c1a;--s3:#272422;--s4:#302d2a;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.11);--b3:rgba(255,255,255,0.18);
  --tx:#ede9e3;--m1:#7a756e;--m2:#a09890;--m3:#c4bdb4;
  --gold:#c9a84c;--gold2:rgba(201,168,76,0.18);--gold3:rgba(201,168,76,0.32);
  --teal:#7fb5ad;--red:#b86060;--green:#7aad88;
  --mono:'DM Mono',monospace;--serif:'Instrument Serif',serif;--sans:'DM Sans',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --tb-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overscroll-behavior:none;overflow:hidden;position:fixed;width:100%}
::-webkit-scrollbar{display:none}
button{font-family:var(--sans);border:none;background:none;cursor:pointer;color:inherit}

/* ── DESKTOP LAYOUT ── */
.desk{display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:52px 1fr;height:100vh}
.desk-top{grid-column:1/-1;height:52px;border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 1.25rem;gap:1rem;z-index:10}
.desk-left{border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.desk-center{display:flex;flex-direction:column;overflow:hidden;position:relative;background:#050505}
.desk-right{border-left:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* ── MOBILE LAYOUT (極致防晃穩定版) ── */
.mob{display:none;flex-direction:column;height:100dvh;position:relative;background:#000;overflow:hidden;touch-action:none}
.mob-preview{flex:1;position:relative;overflow:hidden;min-height:0;background:#050505;touch-action:none}
.mob-recipes{height:115px;flex-shrink:0;border-top:1px solid var(--b1);background:var(--bg);z-index:10;overflow:hidden}
.mob-sheet{position:absolute;bottom:0;left:0;right:0;border-radius:20px 20px 0 0;background:rgba(19,18,16,0.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--b2);z-index:50;transition:transform .28s cubic-bezier(.25,1,.5,1);touch-action:none}
.mob-toolbar{height:calc(var(--tb-h) + var(--safe-b));padding-bottom:var(--safe-b);border-top:1px solid var(--b1);background:rgba(15,14,13,0.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;position:relative;z-index:51}
.mob-tb-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:.5rem .75rem;color:var(--m2)}
.mob-tb-btn.active{color:var(--gold)}
.mob-tb-btn span{font-family:var(--sans);font-size:.68rem;font-weight:500}

/* ── LOGO & HEADER ── */
.logo{display:flex;align-items:center;gap:.6rem}
.logo-mark{width:24px;height:24px;background:var(--gold);border-radius:5px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:14px;height:14px;stroke:#111;fill:none;stroke-width:2}
.logo-name{font-family:var(--serif);font-size:1rem;font-style:italic}
.logo-tag{font-family:var(--mono);font-size:.55rem;color:var(--m1);letter-spacing:.05em}
.top-tabs{display:flex;background:var(--s2);border-radius:6px;padding:2px}
.top-tab{padding:.25rem .75rem;border-radius:4px;font-family:var(--mono);font-size:.7rem;color:var(--m2)}
.top-tab.active{background:var(--s3);color:var(--tx)}
.top-right{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.hdr-btn{padding:.3rem .75rem;border:1px solid var(--b2);border-radius:6px;font-family:var(--mono);font-size:.7rem;color:var(--m2)}
.hdr-btn:hover{color:var(--tx);border-color:var(--b3)}

/* ── SIDEBAR LIST ── */
.sb-hdr{padding:.7rem .9rem .4rem;display:flex;align-items:center;justify-content:space-between}
.sb-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;color:var(--m1)}
.sb-add{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--m1);font-size:1.1rem;cursor:pointer}
.sb-add:hover{background:var(--s2);color:var(--tx)}
.recipe-list{flex:1;overflow-y:auto;padding:0 .4rem .4rem}
.ri{display:flex;align-items:center;gap:.6rem;padding:.45rem .55rem;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.ri:hover{background:var(--s2)}
.ri.active{background:var(--s2);border-color:var(--gold3)}
.ri-thumb{width:40px;height:40px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--s3)}
.ri-thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.ri-info{flex:1;min-width:0}
.ri-name{font-size:.8rem;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-mood{font-size:.65rem;color:var(--m1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── CANVAS VIEWPORT (CRITICAL FOR ZOOM & PAN) ── */
.cv-bar{padding:.5rem .85rem;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:.5rem;flex-shrink:0;background:var(--bg);z-index:10}
.cv-badge{font-family:var(--mono);font-size:.65rem;color:var(--m2);background:var(--s2);padding:2px 7px;border-radius:4px}
.cmp-btn{margin-left:auto;padding:.3rem .75rem;background:var(--s2);border:1px solid var(--b2);border-radius:5px;font-family:var(--mono);font-size:.65rem;color:var(--m2);user-select:none}
.cmp-btn:active{background:var(--s3);color:var(--tx)}
.pip-btn{padding:.3rem .75rem;background:var(--s2);border:1px solid var(--b2);border-radius:5px;font-family:var(--mono);font-size:.65rem;color:var(--m2)}
.pip-btn.active{background:var(--gold2);color:var(--gold);border-color:var(--gold)}

.cv-wrap{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
.cv-wrap:active{cursor:grabbing}
.cv-wrap.pipette-mode{cursor:crosshair}
#d-canvas, #mob-canvas{position:absolute;transform-origin:0 0;display:none;box-shadow:0 10px 40px rgba(0,0,0,0.6);will-change:transform}

/* 局部框選取景框線（優化粗細與顏色） */
.crop-box{position:absolute;border:2px dashed var(--gold);background:rgba(201,168,76,0.15);pointer-events:none;display:none;z-index:99;box-shadow:0 0 10px rgba(0,0,0,0.5)}

.drop-zone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop-ring{width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--b3);margin-bottom:1rem}
.drop-title{font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--m3)}

/* ── 正方形縮圖列 ── */
.strip{padding:.5rem .75rem;border-top:1px solid var(--b1);display:flex;gap:.5rem;overflow-x:auto;flex-shrink:0;background:var(--bg)}
.st-item{flex-shrink:0;cursor:pointer;border-radius:8px;overflow:hidden;border:2px solid transparent;transition:all .15s;position:relative;width:64px;height:64px;background:var(--s2)}
.st-item.active{border-color:var(--gold)}
.st-canvas, .mob-st-canvas{width:100%;height:100%;object-fit:cover;display:block}
.st-label{position:absolute;bottom:0;left:0;right:0;padding:2px;font-family:var(--sans);font-size:.52rem;font-weight:600;text-align:center;background:rgba(0,0,0,0.65);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* AI BAR */
.ai-bar{padding:.5rem .85rem;border-top:1px solid var(--b1);display:flex;align-items:center;gap:1rem;flex-shrink:0;background:var(--bg)}
.ai-scene{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.ai-scene-lbl{font-family:var(--mono);font-size:.55rem;color:var(--m1)}
.ai-scene-val{font-family:var(--mono);font-size:.7rem;color:var(--tx);font-weight:500}
.ai-action-btn{padding:.4rem 1rem;background:linear-gradient(135deg, var(--gold) 0%, #b3923b 100%);border-radius:6px;font-size:.72rem;color:#111;font-weight:600;margin-left:auto;box-shadow:0 2px 8px rgba(201,168,76,0.2)}

/* ── RIGHT SLIDERS ── */
.rp-tabs{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0}
.rp-tab{flex:1;padding:.6rem;font-family:var(--mono);font-size:.62rem;color:var(--m1);text-align:center;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--tx);border-bottom-color:var(--gold)}
.rp-body{flex:1;overflow-y:auto;padding:.8rem .9rem}
.rp-sec{margin-bottom:1.2rem}
.rp-sec-hdr{font-family:var(--mono);font-size:.58rem;color:var(--m1);margin-bottom:.5rem;display:flex;justify-content:space-between}
.sl-row{display:flex;align-items:center;gap:.6rem}
.sl-track{flex:1;height:24px;position:relative;display:flex;align-items:center}
.sl-rail{position:absolute;left:0;right:0;height:3px;background:var(--s3);border-radius:2px}
.sl-fill{position:absolute;height:3px;background:var(--gold);pointer-events:none;border-radius:2px}
.sl-thumb{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--tx);border:2px solid var(--bg);box-shadow:0 0 0 1.5px var(--gold);pointer-events:none;transform:translateX(-50%)}
input[type=range].sl-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.sl-val{font-family:var(--mono);font-size:.7rem;color:var(--tx);min-width:28px;text-align:right}

.rail-sat{background:linear-gradient(to right,#555,#d03030)!important}
.rail-temp{background:linear-gradient(to right,#4080c8,#c88030)!important}
.rail-tint{background:linear-gradient(to right,#408840,#b040b0)!important}

.dl-btn{width:100%;padding:.7rem;background:var(--gold);border-radius:8px;font-size:.8rem;color:#111;font-weight:600;margin-top:.5rem}

/* ── MOBILE SPECIFIC (優化滑動與觸控熱區) ── */
.mob-strip{display:flex;gap:.65rem;overflow-x:auto;padding:.6rem .8rem;align-items:center;width:100%;-webkit-overflow-scrolling:touch}
.mob-st{flex-shrink:0;cursor:pointer;border-radius:10px;overflow:hidden;border:2px solid transparent;width:72px;height:72px;background:var(--s2);position:relative;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.mob-st.active{border-color:var(--gold)}
.sheet-handle{width:40px;height:5px;background:var(--b3);border-radius:3px;margin:.7rem auto .5rem;padding:.2rem 0}
.sheet-tabs{display:flex;border-bottom:1px solid var(--b1);padding:0 .5rem}
.sheet-tab{flex:1;padding:.6rem;font-family:var(--mono);font-size:.7rem;color:var(--m1);text-align:center}
.sheet-tab.active{color:var(--tx);border-bottom-color:var(--gold);font-weight:600}
.sheet-body{padding:.8rem 1.2rem calc(1.2rem + var(--safe-b));overflow-y:auto;max-height:calc(48vh - 60px);-webkit-overflow-scrolling:touch}

/* 頂部對比按鈕手機優化版 */
.mob-top-bar{position:absolute;top:env(safe-area-inset-top,15px);left:1rem;right:1rem;display:flex;justify-content:space-between;align-items:center;z-index:40;pointer-events:none}
.mob-badge{pointer-events:auto;background:rgba(0,0,0,0.6);font-family:var(--mono);font-size:.65rem;padding:4px 10px;border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--b1)}
.mob-cmp{pointer-events:auto;background:rgba(255,255,255,0.12);border:1px solid var(--b2);padding:.4rem .9rem;border-radius:6px;font-size:.7rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);user-select:none;-webkit-user-select:none}

.toast{position:fixed;bottom:calc(var(--tb-h) + var(--safe-b) + .8rem);left:50%;transform:translate(-50%, 8px);background:rgba(30,28,26,0.95);border:1px solid var(--b2);color:var(--tx);padding:.5rem 1.2rem;border-radius:20px;font-size:.75rem;z-index:999;opacity:0;transition:all .2s cubic-bezier(.25,1,.5,1);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4);white-space:nowrap}
.toast.show{transform:translate(-50%, 0);opacity:1}

@media(max-width:860px){.desk{display:none}.mob{display:flex}}
@media(min-width:861px){.mob{display:none}.desk{display:grid}}
</style>
</head>
<body>

<div class="desk">
  <header class="desk-top">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14"/></svg></div>
      <span class="logo-name">KaiLun Film Lab</span>
      <span class="logo-tag">| Engine Pro 2.5</span>
    </div>
    <div class="top-tabs" style="margin-left:1.5rem"><div class="top-tab active">暗房調色</div></div>
    <div class="top-right">
      <button class="hdr-btn" onclick="triggerUpload()">導入相片</button>
      <input type="file" id="d-file" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
    </div>
  </header>

  <aside class="desk-left">
    <div class="sb-hdr"><span class="sb-label">底片大補帖 RECIPES</span><div class="sb-add" onclick="saveAsRecipe()">+</div></div>
    <div class="recipe-list" id="d-recipe-list"></div>
  </aside>

  <section class="desk-center">
    <div class="cv-bar">
      <div class="cv-badge" id="d-badge">未導入</div>
      <button class="pip-btn" id="d-pipette" onclick="togglePipetteMode()"><span>🧪 框選區域校正白平衡</span></button>
      <button class="cmp-btn" onmousedown="showOriginal()" onmouseup="showFiltered()" onmouseleave="showFiltered()">對比</button>
    </div>
    
    <div class="cv-wrap" id="d-cv-wrap" onmousedown="panStart(event)" onmousemove="panMove(event)" onmouseup="panEnd()" onmouseleave="panEnd()" onwheel="handleWheel(event)">
      <div class="crop-box" id="d-crop-box"></div>
      <div class="drop-zone" id="d-drop">
        <input type="file" accept="image/*" onchange="handleFileSelect(event)">
        <div class="drop-ring"></div>
        <div class="drop-title">拖放或點擊加入照片</div>
      </div>
      <canvas id="d-canvas"></canvas>
    </div>

    <div class="strip" id="d-strip"></div>
    
    <div class="ai-bar">
      <div class="ai-scene"><span class="ai-scene-lbl">🏛 建築感</span><span class="ai-scene-val" id="sc-b">0%</span></div>
      <div class="ai-scene"><span class="ai-scene-lbl">🛤 街道感</span><span class="ai-scene-val" id="sc-s">0%</span></div>
      <div class="ai-scene"><span class="ai-scene-lbl">🌳 自然感</span><span class="ai-scene-val" id="sc-n">0%</span></div>
      <button class="ai-action-btn" onclick="runAIOptimize()">✨ 一鍵 AI 智能優化</button>
    </div>
  </section>

  <aside class="desk-right">
    <div class="rp-tabs"><div class="rp-tab active">控制面板</div></div>
    <div class="rp-body" id="d-sliders"></div>
  </aside>
</div>

<div class="mob">
  <div class="mob-top-bar">
    <div class="mob-badge" id="m-badge" style="color:var(--m2)">未導入</div>
    <button class="mob-cmp" id="m-cmp-btn" ontouchstart="showOriginal(); e.preventDefault();" ontouchend="showFiltered(); e.preventDefault();">對比</button>
  </div>

  <div class="mob-preview" id="m-cv-wrap" ontouchstart="mobTouchStart(event)" ontouchmove="mobTouchMove(event)" ontouchend="mobTouchEnd(event)">
    <div class="crop-box" id="m-crop-box"></div>
    <div class="drop-zone" id="m-drop" style="z-index:20">
      <input type="file" accept="image/*" onchange="handleFileSelect(event)">
      <div class="drop-title" style="font-size:0.95rem;border:1px dashed var(--b3);padding:1rem;border-radius:8px">點擊此處導入相片檔案</div>
    </div>
    <canvas id="mob-canvas"></canvas>
  </div>
  
  <div class="mob-recipes">
    <div class="mob-strip" id="m-strip"></div>
  </div>

  <div class="mob-sheet" id="m-sheet" style="transform:translateY(100%)">
    <div class="sheet-handle" onclick="toggleMobSheet()"></div>
    <div class="sheet-tabs">
      <div class="sheet-tab active" id="mtab-adj" onclick="switchMobSheetTab('adj')">微調滑桿</div>
      <div class="sheet-tab" id="mtab-ai" onclick="switchMobSheetTab('ai')">AI 智能分析</div>
    </div>
    <div class="sheet-body" id="m-sheet-body"></div>
  </div>

  <div class="mob-toolbar">
    <button class="mob-tb-btn active" id="mtb-recipe" onclick="setMobMode('recipe')"><span>底片庫</span></button>
    <button class="mob-tb-btn" id="mtb-edit" onclick="setMobMode('edit')"><span>調色盤</span></button>
    <button class="mob-tb-btn" id="m-pipette-btn" onclick="togglePipetteMode()"><span>🧪 框選平衡</span></button>
    <button class="mob-tb-btn" onclick="triggerUpload()"><span>換照片</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const baseRecipes = [
  { id:'c1', name:'Classic Chrome', mood:'人文電影、低飽和經典色彩', params:{ exp:0, cont:14, sat:-14, temp:3, tint:-2, sharp:8, grain:12, vib:4 } },
  { id:'c2', name:'Kodak Gold 200', mood:'溫暖懷舊、午後金黃陽光感', params:{ exp:3, cont:10, sat:12, temp:12, tint:2, sharp:6, grain:18, vib:6 } },
  { id:'c3', name:'Fujifilm Superia', mood:'清冷綠色調、日系空氣通透感', params:{ exp:2, cont:-4, sat:4, temp:-12, tint:14, sharp:8, grain:10, vib:-2 } },
  { id:'c4', name:'Portra 400', mood:'柔和通透、白皙細膩人像膚色', params:{ exp:4, cont:-8, sat:-5, temp:2, tint:1, sharp:5, grain:6, vib:2 } },
  { id:'c5', name:'Cinestill 800T', mood:'電影感夜街、微弱光霓虹冷調', params:{ exp:6, cont:16, sat:6, temp:-16, tint:-6, sharp:10, grain:22, vib:8 } },
  { id:'c6', name:'Monochrome 黑白', mood:'高反差、人文顆粒光影', params:{ exp:0, cont:24, sat:-100, temp:0, tint:0, sharp:12, grain:28, vib:0 } }
];

let userRecipes = [];
try { const s = localStorage.getItem('kl-recipes-v2'); if(s) userRecipes = JSON.parse(s); }catch(e){}

let curId = 'c1';
let imgElement = null;

let masterCanvas = document.createElement('canvas');
let thumbMasterCanvas = document.createElement('canvas'); // 80x80 快取

let adj = { exp:0, cont:0, sat:0, temp:0, tint:0, sharp:0, grain:0, vib:0 };

// 檢視轉換矩陣（手機電腦全通用系統）
let transformState = { x:0, y:0, scale:1 };
let isDragging = false;
let startPanX = 0, startPanY = 0;

// 框選白平衡狀態
let isPipetteMode = false;
let isSelectingRegion = false;
let regionStart = { x:0, y:0 };

// 手機多點觸控矩陣快取
let touchStartDist = 0;
let touchStartScale = 1;
let touchStartPos = { x:0, y:0 };

const sliderDefs = [
  { k:'exp', zh:'曝光度', en:'Exposure', min:-50, max:50, def:0 },
  { k:'cont', zh:'對比度', en:'Contrast', min:-50, max:50, def:0 },
  { k:'sat', zh:'飽和度', en:'Saturation', min:-100, max:100, def:0, clsl:'rail-sat' },
  { k:'temp', zh:'色溫', en:'Temperature', min:-50, max:50, def:0, clsl:'rail-temp' },
  { k:'tint', zh:'色調', en:'Tint', min:-50, max:50, def:0, clsl:'rail-tint' },
  { k:'sharp', zh:'銳利度', en:'Sharpness', min:0, max:50, def:0 },
  { k:'grain', zh:'顆粒感', en:'Grain', min:0, max:100, def:0 },
  { k:'vib', zh:'鮮豔度', en:'Vibrance', min:-50, max:50, def:0 }
];

window.addEventListener('DOMContentLoaded', () => {
  buildSlidersUI();
  buildDynamicStrips();
  applyRecipe(curId, false);
  
  // 阻斷行動端全網頁非法彈性回彈
  document.body.addEventListener('touchmove', (e) => {
    if (e.target.closest('.sheet-body') || e.target.closest('.mob-strip') || e.target.closest('.recipe-list')) {
      return; // 允許控制面版與滑動列正常滾動
    }
    e.preventDefault();

function resetViewport() {

  const ratio = Math.min(cw / imgElement.width, ch / imgElement.height, 1) * 0.95;
  
  transformState.scale = ratio;
  transformState.x = (cw - imgElement.width * ratio) / 2;
  transformState.y = (ch - imgElement.height * ratio) / 2;
  applyTransform();
}

function applyTransform() {
  const dc = document.getElementById('d-canvas');

}

// ── 專業級濾鏡演算法底層 ──
function applyFilterCore(ctx, w, h, p) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;

  const ev = (p.exp || 0) / 25;
  const cv = ((p.cont || 0) + 50) / 50;
  const sv = ((p.sat || 0) + 100) / 100;
  const tempV = (p.temp || 0) * 0.6;
  const tintV = (p.tint || 0) * 0.6;
  const vibV = (p.vib || 0) / 50;
  const grainV = p.grain || 0;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];

    if(ev !== 0) { const f = Math.pow(2, ev); r *= f; g *= f; b *= f; }
    if(cv !== 1) {
      r = ((r/255 - 0.5) * cv + 0.5) * 255;
      g = ((g/255 - 0.5) * cv + 0.5) * 255;
      b = ((b/255 - 0.5) * cv + 0.5) * 255;
    }
    r += tempV; b -= tempV;
    g += tintV; r -= tintV * 0.5; b -= tintV * 0.5;

    let max = Math.max(r, g, b);
    let l = (max + Math.min(r, g, b)) / 2;
    if(vibV !== 0) {
      let amt = (Math.abs(max - l) / 127) * vibV;
      r += (max - r) * amt; g += (max - g) * amt; b += (max - b) * amt;
    }
    if(sv !== 1) {
      let gray = 0.299 * r + 0.587 * g + 0.114 * b;
      r = gray + (r - gray) * sv; g = gray + (g - gray) * sv; b = gray + (b - gray) * sv;
    }
    if(grainV > 0) {
      const ns = (Math.random() - 0.5) * grainV * 0.55;
      r += ns; g += ns; b += ns;
    }

    d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
    d[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
    d[i+2] = b < 0 ? 0 : b > 255 ? 255 : b;
  }
  ctx.putImageData(imgData, 0, 0);
}

function calculateAndApplyWBBypet(x1, y1, x2, y2) {
  if(!imgElement) return;
  const dc = document.getElementById('d-canvas');
  const ctx = dc.getContext('2d');

  const rx = Math.min(x1, x2), ry = Math.min(y1, y2);
  const rw = Math.abs(x1 - x2), rh = Math.abs(y1 - y2);
  if(rw < 4 || rh < 4) return;

  try {
    const imgData = ctx.getImageData(rx, ry, rw, rh);
    const d = imgData.data;
    let rSum = 0, gSum = 0, bSum = 0, count = 0;

    for (let i = 0; i < d.length; i += 4) {
      rSum += d[i]; gSum += d[i+1]; bSum += d[i+2];
      count++;
    }

    if (count > 0) {
      const rAvg = rSum / count, gAvg = gSum / count, bAvg = bSum / count;
      const avg = (rAvg + gAvg + bAvg) / 3;

      if (avg > 0) {
        const diffTemp = Math.floor(((rAvg - bAvg) / avg) * 28);
        const diffTint = Math.floor(((gAvg - ((rAvg + bAvg) / 2)) / avg) * 28);

        adj.temp = Math.max(-50, Math.min(50, adj.temp - diffTemp));
        adj.tint = Math.max(-50, Math.min(50, adj.tint - diffTint));

        syncSlidersUI();
        renderMainView();
        toast('✓ AI 區域矩陣白平衡自動修正完成');
      }
    }
  } catch (e) { console.error(e); }
  togglePipetteMode();
}

// ── 桌機滑鼠控制系統 ──
function panStart(e) {
  if(!imgElement) return;
  const wrap = document.getElementById('d-cv-wrap');
  const rect = wrap.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  if (isPipetteMode) {
    isSelectingRegion = true;
    regionStart.x = clickX; regionStart.y = clickY;
    const box = document.getElementById('d-crop-box');
    box.style.left = clickX + 'px'; box.style.top = clickY + 'px';
    box.style.width = '0px'; box.style.height = '0px'; box.style.display = 'block';
  } else {
    isDragging = true;
    startPanX = e.clientX - transformState.x;
    startPanY = e.clientY - transformState.y;
  }
}

function panMove(e) {
  if(!imgElement) return;
  if (isPipetteMode && isSelectingRegion) {
    const wrap = document.getElementById('d-cv-wrap');
    const rect = wrap.getBoundingClientRect();
    const curX = e.clientX - rect.left; const curY = e.clientY - rect.top;
    const box = document.getElementById('d-crop-box');
    const x = Math.min(regionStart.x, curX); const y = Math.min(regionStart.y, curY);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = Math.abs(regionStart.x - curX) + 'px'; box.style.height = Math.abs(regionStart.y - curY) + 'px';
  } else if (isDragging) {
    transformState.x = e.clientX - startPanX;
    transformState.y = e.clientY - startPanY;
    applyTransform();
  }
}

function panEnd() {
  if (isPipetteMode && isSelectingRegion) {
    isSelectingRegion = false;
    const box = document.getElementById('d-crop-box');
    box.style.display = 'none';

    const canvasX1 = Math.floor((parseFloat(box.style.left) - transformState.x) / transformState.scale);
    const canvasY1 = Math.floor((parseFloat(box.style.top) - transformState.y) / transformState.scale);
    const canvasX2 = Math.floor((parseFloat(box.style.left) + parseFloat(box.style.width) - transformState.x) / transformState.scale);
    const canvasY2 = Math.floor((parseFloat(box.style.top) + parseFloat(box.style.height) - transformState.y) / transformState.scale);

    calculateAndApplyWBBypet(canvasX1, canvasY1, canvasX2, canvasY2);
  }
  isDragging = false;
}

function handleWheel(e) {
  if(!imgElement) return;
  e.preventDefault();
  const rect = document.getElementById('d-cv-wrap').getBoundingClientRect();
  const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;

  const nextScale = e.deltaY < 0 ? transformState.scale * 1.12 : transformState.scale / 1.12;
  if(nextScale < 0.15 || nextScale > 12) return;

  transformState.x = mouseX - (mouseX - transformState.x) * (nextScale / transformState.scale);
  transformState.y = mouseY - (mouseY - transformState.y) * (nextScale / transformState.scale);
  transformState.scale = nextScale;
  applyTransform();
}

// ── 📱 手機端極致流暢多點觸控手勢核心（完美修正瞬移與晃動） ──
function mobTouchStart(e) {
  if(!imgElement) return;
  e.preventDefault(); // 阻斷 iOS 滾動
  const rect = document.getElementById('m-cv-wrap').getBoundingClientRect();

  if (isPipetteMode) {
    isSelectingRegion = true;
    const t = e.touches[0];
    const clickX = t.clientX - rect.left; const clickY = t.clientY - rect.top;
    regionStart.x = clickX; regionStart.y = clickY;
    
    const box = document.getElementById('m-crop-box');
    box.style.left = clickX+'px'; box.style.top = clickY+'px';
    box.style.width = '0px'; box.style.height = '0px'; box.style.display = 'block';
  } else {
    if (e.touches.length === 1) {
      isDragging = true;
      startPanX = e.touches[0].clientX - transformState.x;
      startPanY = e.touches[0].clientY - transformState.y;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      touchStartDist = Math.sqrt(dx*dx + dy*dy);
      touchStartScale = transformState.scale;
      
      touchStartPos.x = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      touchStartPos.y = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    }
  }
}

function mobTouchMove(e) {
  if(!imgElement) return;
  e.preventDefault();
  const rect = document.getElementById('m-cv-wrap').getBoundingClientRect();

  if (isPipetteMode && isSelectingRegion) {
    const t = e.touches[0];
    const curX = t.clientX - rect.left; const curY = t.clientY - rect.top;
    const box = document.getElementById('m-crop-box');
    const x = Math.min(regionStart.x, curX); const y = Math.min(regionStart.y, curY);
    box.style.left = x+'px'; box.style.top = y+'px';
    box.style.width = Math.abs(regionStart.x - curX)+'px'; box.style.height = Math.abs(regionStart.y - curY)+'px';
  } else {
    if (e.touches.length === 1 && isDragging) {
      transformState.x = e.touches[0].clientX - startPanX;
      transformState.y = e.touches[0].clientY - startPanY;
      applyTransform();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(touchStartDist === 0) return;

      const nextScale = touchStartScale * (dist / touchStartDist);
      if(nextScale < 0.15 || nextScale > 12) return;

      transformState.x = touchStartPos.x - (touchStartPos.x - transformState.x) * (nextScale / transformState.scale);
      transformState.y = touchStartPos.y - (touchStartPos.y - transformState.y) * (nextScale / transformState.scale);
      transformState.scale = nextScale;
      applyTransform();
    }
  }
}

function mobTouchEnd(e) {
  if (isPipetteMode && isSelectingRegion) {
    isSelectingRegion = false;
    const box = document.getElementById('m-crop-box');
    box.style.display = 'none';

    const canvasX1 = Math.floor((parseFloat(box.style.left) - transformState.x) / transformState.scale);
    const canvasY1 = Math.floor((parseFloat(box.style.top) - transformState.y) / transformState.scale);
    const canvasX2 = Math.floor((parseFloat(box.style.left) + parseFloat(box.style.width) - transformState.x) / transformState.scale);
    const canvasY2 = Math.floor((parseFloat(box.style.top) + parseFloat(box.style.height) - transformState.y) / transformState.scale);

    calculateAndApplyWBBypet(canvasX1, canvasY1, canvasX2, canvasY2);
  }
  isDragging = false;
  touchStartDist = 0;
}

// ── 下載導出 ──
function exportFinalPhoto() {
  if(!imgElement) return;
  const out = document.createElement('canvas');
  out.width = imgElement.width; out.height = imgElement.height;
  const ctx = out.getContext('2d');
  ctx.drawImage(masterCanvas, 0, 0);
  applyFilterCore(ctx, out.width, out.height, adj);
  
  out.toBlob(b => {
    const a = document.createElement('a');
    a.download = `KaiLunFilm_${Date.now()}.jpg`;
    a.href = URL.createObjectURL(b);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('✓ 高解析相片已儲存至您的裝置內');
  }, 'image/jpeg', 0.96);
}
